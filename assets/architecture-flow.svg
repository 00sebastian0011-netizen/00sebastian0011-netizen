<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 168" width="900" height="168" role="img" aria-label="Flujo de arquitectura end-to-end: Captura RPA, Lógica e IA, Datos y Entrega">
  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      @keyframes dashFlow {
        to { stroke-dashoffset: -24; }
      }
      .flow-line {
        stroke-dasharray: 4 4;
        animation: dashFlow 1.2s linear infinite;
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="167" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="29" class="sans" font-size="12.5" font-weight="700" fill="#f0f6fc" letter-spacing="0.6">FLUJO DE ARQUITECTURA END-TO-END · DEL PROCESO MANUAL AL PRODUCTO</text>
  <rect x="752" y="13" width="124" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="814" y="27.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#3fb950">PIPELINE ACTIVO</text>

  <!-- Connectors -->
  <line class="flow-line" x1="216" y1="96" x2="244" y2="96" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="240,92 246,96 240,100" fill="#58a6ff"/>

  <line class="flow-line" x1="436" y1="96" x2="464" y2="96" stroke="#a371f7" stroke-width="2"/>
  <polygon points="460,92 466,96 460,100" fill="#a371f7"/>

  <line class="flow-line" x1="656" y1="96" x2="684" y2="96" stroke="#3fb950" stroke-width="2"/>
  <polygon points="680,92 686,96 680,100" fill="#3fb950"/>

  <!-- Stage 1 -->
  <rect x="24" y="46" width="192" height="100" rx="10" fill="#161b22" stroke="#1f6feb" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="36" y="57" width="118" height="20" rx="5" fill="#13233a"/>
  <text x="44" y="70.5" class="mono" font-size="10" font-weight="700" fill="#58a6ff">01 · CAPTURA &amp; RPA</text>
  <text x="36" y="95" class="mono" font-size="11" fill="#e6edf3">• Playwright / Puppeteer</text>
  <text x="36" y="114" class="mono" font-size="11" fill="#8b949e">• Multi-sesión &amp; Iframes</text>
  <text x="36" y="133" class="mono" font-size="11" fill="#8b949e">• Gmail OTP &amp; Scraping</text>

  <!-- Stage 2 -->
  <rect x="244" y="46" width="192" height="100" rx="10" fill="#161b22" stroke="#a371f7" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="256" y="57" width="112" height="20" rx="5" fill="#211834"/>
  <text x="264" y="70.5" class="mono" font-size="10" font-weight="700" fill="#d2a8ff">02 · IA &amp; LÓGICA</text>
  <text x="256" y="95" class="mono" font-size="11" fill="#e6edf3">• Gemini Vision CAPTCHA</text>
  <text x="256" y="114" class="mono" font-size="11" fill="#8b949e">• FastAPI / Express / Hono</text>
  <text x="256" y="133" class="mono" font-size="11" fill="#8b949e">• Edge-TTS &amp; Voice AI</text>

  <!-- Stage 3 -->
  <rect x="464" y="46" width="192" height="100" rx="10" fill="#161b22" stroke="#3fb950" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="476" y="57" width="118" height="20" rx="5" fill="#11261b"/>
  <text x="484" y="70.5" class="mono" font-size="10" font-weight="700" fill="#3fb950">03 · DATOS &amp; SYNC</text>
  <text x="476" y="95" class="mono" font-size="11" fill="#e6edf3">• PostgreSQL + PostGIS</text>
  <text x="476" y="114" class="mono" font-size="11" fill="#8b949e">• Supabase RLS &amp; Drizzle</text>
  <text x="476" y="133" class="mono" font-size="11" fill="#8b949e">• Sheets, PDF &amp; ExcelJS</text>

  <!-- Stage 4 -->
  <rect x="684" y="46" width="192" height="100" rx="10" fill="#161b22" stroke="#d29922" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="696" y="57" width="120" height="20" rx="5" fill="#272011"/>
  <text x="704" y="70.5" class="mono" font-size="10" font-weight="700" fill="#e3b341">04 · ENTREGA FINAL</text>
  <text x="696" y="95" class="mono" font-size="11" fill="#e6edf3">• React 19 / Vue / Astro</text>
  <text x="696" y="114" class="mono" font-size="11" fill="#8b949e">• Electron &amp; Qt6 (.exe)</text>
  <text x="696" y="133" class="mono" font-size="11" fill="#8b949e">• Cloudflare &amp; Docker</text>
</svg>
