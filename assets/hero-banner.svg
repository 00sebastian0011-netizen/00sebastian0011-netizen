<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Yandy Sebastian — Full Stack Developer, RPA &amp; Automation Architect, AI Builder">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#101b33"/>
    </linearGradient>
    <linearGradient id="topBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="30%" stop-color="#58a6ff"/>
      <stop offset="65%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="65%" stop-color="#c9e2ff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#1f6feb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientLeft" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="900" height="260" rx="16"/>
    </clipPath>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; r: 4; }
        50% { opacity: 0.45; r: 5.5; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes scanMove {
        0% { transform: translateX(-300px); opacity: 0; }
        25% { opacity: 0.9; }
        75% { opacity: 0.9; }
        100% { transform: translateX(920px); opacity: 0; }
      }
      .pulse-dot { animation: pulseDot 2.2s ease-in-out infinite; }
      .orbit-cw { transform-origin: 768px 122px; animation: spinSlow 32s linear infinite; }
      .orbit-ccw { transform-origin: 768px 122px; animation: spinRev 20s linear infinite; }
      .scan-beam { animation: scanMove 6.5s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background & Grid -->
    <rect x="0" y="0" width="900" height="260" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="900" height="260" fill="url(#techGrid)"/>
    <rect x="0" y="0" width="900" height="260" fill="url(#ambientLeft)"/>
    <circle cx="768" cy="122" r="145" fill="url(#coreGlow)"/>

    <!-- Top Animated Energy Beam -->
    <rect x="0" y="0" width="900" height="2.5" fill="url(#topBeam)" opacity="0.55"/>
    <rect class="scan-beam" x="0" y="0" width="220" height="3" fill="url(#topBeam)"/>

    <!-- Decorative Circuit Traces -->
    <path d="M 590 48 L 642 48 L 664 70 L 692 70" fill="none" stroke="#1f6feb" stroke-width="1" stroke-opacity="0.4"/>
    <path d="M 615 174 L 662 174 L 680 156 L 700 156" fill="none" stroke="#a371f7" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="590" cy="48" r="2.5" fill="#58a6ff" opacity="0.65"/>
    <circle cx="615" cy="174" r="2.5" fill="#a371f7" opacity="0.65"/>

    <!-- Status Pill -->
    <rect x="42" y="30" width="352" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle class="pulse-dot" cx="58" cy="43" r="4" fill="#3fb950"/>
    <text x="72" y="47" class="mono" font-size="10.5" font-weight="600" fill="#c9d1d9" letter-spacing="0.9">ONLINE · COLOMBIA</text>
    <g transform="translate(198, 37.5)">
      <clipPath id="coHeroFlag"><rect x="0" y="0" width="15" height="10" rx="2"/></clipPath>
      <g clip-path="url(#coHeroFlag)">
        <rect x="0" y="0" width="15" height="5" fill="#FCD116"/>
        <rect x="0" y="5" width="15" height="2.5" fill="#003893"/>
        <rect x="0" y="7.5" width="15" height="2.5" fill="#CE1126"/>
      </g>
    </g>
    <text x="220" y="47" class="mono" font-size="10.5" font-weight="600" fill="#c9d1d9" letter-spacing="0.9">· HEALTHTECH &amp; CLOUD</text>

    <!-- Main Identity -->
    <text x="42" y="102" class="sans" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.8">Yandy Sebastian</text>
    <text x="42" y="135" class="sans" font-size="16" font-weight="600" fill="#58a6ff">Full Stack Developer  •  RPA &amp; Automation Architect  •  AI Builder</text>
    <text x="42" y="164" class="sans" font-size="13.5" fill="#94a3b8">Convirtiendo procesos manuales en bots autónomos, apps .exe y plataformas cloud.</text>

    <!-- Bottom Capability Pills -->
    <g transform="translate(42, 192)">
      <rect x="0" y="0" width="122" height="28" rx="7" fill="#131c2e" stroke="#1f6feb" stroke-opacity="0.55" stroke-width="1"/>
      <circle cx="13" cy="14" r="3.5" fill="#3178c6"/>
      <text x="23" y="18" class="mono" font-size="11" font-weight="600" fill="#e6edf3">TypeScript · TS</text>

      <rect x="130" y="0" width="126" height="28" rx="7" fill="#131c2e" stroke="#3572a5" stroke-opacity="0.55" stroke-width="1"/>
      <circle cx="143" cy="14" r="3.5" fill="#ffd43b"/>
      <text x="153" y="18" class="mono" font-size="11" font-weight="600" fill="#e6edf3">Python · FastAPI</text>

      <rect x="264" y="0" width="126" height="28" rx="7" fill="#11221b" stroke="#3fb950" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="277" cy="14" r="3.5" fill="#3fb950"/>
      <text x="287" y="18" class="mono" font-size="11" font-weight="600" fill="#e6edf3">Playwright · RPA</text>

      <rect x="398" y="0" width="114" height="28" rx="7" fill="#18172b" stroke="#a371f7" stroke-opacity="0.55" stroke-width="1"/>
      <circle cx="411" cy="14" r="3.5" fill="#a371f7"/>
      <text x="421" y="18" class="mono" font-size="11" font-weight="600" fill="#e6edf3">Electron · Qt6</text>

      <rect x="520" y="0" width="116" height="28" rx="7" fill="#1e1824" stroke="#f778ba" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="533" cy="14" r="3.5" fill="#f778ba"/>
      <text x="543" y="18" class="mono" font-size="11" font-weight="600" fill="#e6edf3">Gemini · Voice</text>
    </g>

    <!-- Right Orbital Automation Core -->
    <g class="orbit-cw">
      <circle cx="768" cy="122" r="76" fill="none" stroke="#30363d" stroke-width="1.2" stroke-dasharray="6 6"/>
      <circle cx="768" cy="46" r="4" fill="#58a6ff"/>
      <circle cx="844" cy="122" r="3.5" fill="#3fb950"/>
      <circle cx="692" cy="122" r="3" fill="#a371f7"/>
    </g>
    <g class="orbit-ccw">
      <circle cx="768" cy="122" r="55" fill="none" stroke="#1f6feb" stroke-width="1.4" stroke-dasharray="24 14" stroke-opacity="0.75"/>
      <circle cx="768" cy="177" r="3.5" fill="#79c0ff"/>
    </g>
    <!-- Static Center Node -->
    <circle cx="768" cy="122" r="34" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <circle cx="768" cy="122" r="27" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="768" y="127" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#58a6ff">&lt;/&gt;</text>

    <!-- Right Telemetry Pill -->
    <rect x="680" y="210" width="176" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="768" y="224.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#8b949e" letter-spacing="0.6">23 REPOS · PROD READY</text>

    <!-- Outer Crisp Border -->
    <rect x="0.5" y="0.5" width="899" height="259" rx="16" fill="none" stroke="#30363d" stroke-width="1"/>
  </g>
</svg>
