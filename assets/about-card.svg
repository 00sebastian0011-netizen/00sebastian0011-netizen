        <rect x="0" y="5" width="15" height="2.5" fill="#003893"/>
        <rect x="0" y="7.5" width="15" height="2.5" fill="#CE1126"/>
      </g>
    </g>
    <text x="20" y="172" class="mono" font-size="12.5" fill="#79c0ff">enfoque:<tspan fill="#a5d6ff">    "RPA · Cloud/Edge · Desktop .exe"</tspan></text>
    <text x="20" y="199" class="mono" font-size="12.5" fill="#79c0ff">fun_fact:<tspan fill="#3fb950">   "Voz JARVIS al aplaudir 👏"</tspan></text>
    <text x="20" y="226" class="mono" font-size="12.5" fill="#79c0ff">motto:<tspan fill="#d2a8ff">      "Si es manual, lo automatizo"</tspan></text>

    <text x="20" y="251" class="mono" font-size="12" fill="#3fb950">$</text>
    <rect class="cursor" x="34" y="240" width="8" height="13" rx="1" fill="#3fb950"/>
  </g>
  <rect x="0.5" y="0.5" width="481" height="267" rx="14" fill="none" stroke="#30363d" stroke-width="1"/>

