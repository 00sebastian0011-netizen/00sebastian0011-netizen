      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 1.1s step-end infinite; }
    </style>
    <clipPath id="termClip">
      <rect x="0" y="0" width="482" height="268" rx="14"/>
