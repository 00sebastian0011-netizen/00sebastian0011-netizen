    <text x="20" y="91" class="mono" font-size="12.5" fill="#79c0ff">nombre:<tspan fill="#e6edf3">     "Yandy Sebastian"</tspan></text>
    <text x="20" y="118" class="mono" font-size="12.5" fill="#79c0ff">empresa:<tspan fill="#a5d6ff">    "MTD · Medicina Domiciliaria"</tspan></text>
    <text x="20" y="145" class="mono" font-size="12.5" fill="#79c0ff">ubicación:<tspan fill="#a5d6ff">  "Colombia"</tspan></text>
    <g transform="translate(188, 136)">
      <clipPath id="coAboutFlag"><rect x="0" y="0" width="15" height="10" rx="2"/></clipPath>
      <g clip-path="url(#coAboutFlag)">
