name: Update Engineering Telemetry

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate stats dashboard SVG
        run: node .github/scripts/update-metrics.mjs
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Commit updated telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dashboard.svg assets/metrics-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(metrics): update engineering telemetry dashboard"
            git push
          else
            echo "No telemetry changes to commit."
          fi
